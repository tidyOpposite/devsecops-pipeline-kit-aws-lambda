[build-system]
requires = ["setuptools==82.0.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devsecops-pipeline-cli"
version = "1.0.1"
description = "CLI for setting up, validating, deploying, and operating a secure AWS Lambda delivery pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "DevSecOps Pipeline Kit maintainers" }
]
dependencies = []
keywords = ["devsecops", "aws", "lambda", "terraform"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
]

[project.scripts]
devsecops = "devsecops_cli.main:main"

[tool.setuptools]
package-dir = { "" = "cli" }

[tool.setuptools.packages.find]
where = ["cli"]
include = ["devsecops_cli*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F", "I"]
