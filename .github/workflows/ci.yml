name: Core CLI and Terraform
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and offline integration tests
        run: PYTHONPATH=cli python -m unittest discover -s cli/tests
      - name: Check Python formatting and imports
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          python -m pip install ruff==0.17.4
          ruff check cli/devsecops_cli cli/tests
          ruff format --check cli/devsecops_cli cli/tests
      - name: Package and installed CLI smoke check
        run: |
          python -m pip install build==1.5.0
          python -m build
          python -m pip install --no-deps dist/*.whl
          devsecops --version
          python -c 'from importlib.metadata import version; from devsecops_cli import VERSION; assert VERSION == version("devsecops-pipeline-cli")'
          devsecops --help
          devsecops plan --help
          sh -n install.sh
      - name: Prepare release candidate files
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          python -m pip install twine==7.0.0
          python -m twine check dist/*
          VERSION=$(python -c 'from devsecops_cli import VERSION; print(VERSION)')
          git archive --format=tar.gz --prefix="devsecops-cli-kit-$VERSION/" \
            --output="dist/devsecops-cli-kit-$VERSION-source.tar.gz" HEAD
          git rev-parse HEAD > dist/SOURCE_COMMIT
          (cd dist && sha256sum *.whl *.tar.gz SOURCE_COMMIT > SHA256SUMS)
      - name: Store release candidate files
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-release-candidate
          path: dist/
          if-no-files-found: error
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.10.5'
          terraform_wrapper: false
      - name: Validate and test using mocked AWS
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform validate -no-color
          terraform -chdir=terraform test -no-color
      - name: Verify real provider credential process against local STS
        env:
          DEVSECOPS_TEST_TERRAFORM: terraform
          DEVSECOPS_TEST_AWS_PROVIDER_DIR: terraform/.terraform/providers
        run: PYTHONPATH=cli python -m unittest discover -s cli/tests -p test_credentials.py
