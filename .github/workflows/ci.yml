name: CLI and Terraform CI

# Validate both pull requests and the resulting main branch; manual dispatch is
# retained for maintainers diagnosing runner or dependency changes.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  # Jobs do not publish artifacts outside their own run or mutate repository state.
  contents: read

env:
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_WORKING_DIR: terraform

jobs:
  cli-tests:
    name: CLI Unit, Golden, E2E, and Install Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Exercise every Python version declared in package compatibility metadata.
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run CLI test suite
        run: PYTHONPATH=cli python -m unittest discover -s cli/tests

      - name: Test optional diploma Lambda workload
        run: python -m unittest discover -s examples/text-stats/tests

      - name: Verify optional terminal renderer
        run: |
          python -m pip install 'rich==14.2.0'
          PYTHONPATH=cli:cli/tests python -m unittest test_product_audit.ValidationAndUiTests.test_real_rich_renderer_with_readiness_gaps

      - name: Build root package artifacts
        # Building sdist and wheel catches packaging omissions that editable
        # source-tree tests cannot detect.
        run: |
          python -m pip install --upgrade pip==26.1.2 build==1.5.0 setuptools==82.0.1 wheel==0.47.0
          python -m build

      - name: Install root CLI package smoke test
        # Install the project as users do and verify its generated launcher.
        run: |
          python -m pip install --no-deps --no-build-isolation .
          devsecops --version

      - name: Stage candidate release assets
        if: github.ref == 'refs/heads/main' && matrix.python-version == '3.11'
        run: |
          cp install.sh dist/install.sh
          cd dist
          sha256sum install.sh *.whl *.tar.gz > SHA256SUMS

      - name: Upload candidate release assets
        if: github.ref == 'refs/heads/main' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: |
            dist/install.sh
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  terraform-validate:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install root CLI package
        run: |
          python -m pip install --upgrade pip==26.1.2 setuptools==82.0.1 wheel==0.47.0
          python -m pip install --no-deps --no-build-isolation .
          devsecops --version

      - name: Render generated Terraform variables
        # Terraform validation needs the CLI-owned auto.tfvars shape that a real
        # project generates from normalized configuration.
        run: |
          devsecops config new --preset balanced --render
          test -f "${TF_WORKING_DIR}/generated.auto.tfvars"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform -chdir="${TF_WORKING_DIR}" fmt -check -recursive

      - name: Terraform init without backend
        # CI validates module structure without contacting or locking shared state.
        run: terraform -chdir="${TF_WORKING_DIR}" init -backend=false -input=false -no-color

      - name: Terraform validate
        run: terraform -chdir="${TF_WORKING_DIR}" validate -no-color

      - name: Test AWS constraints with mocked provider
        run: terraform -chdir="${TF_WORKING_DIR}" test -no-color

      - name: Rehearse isolated acceptance without AWS credentials
        run: |
          cp terraform/.terraform.lock.hcl terraform/acceptance/.terraform.lock.hcl
          terraform -chdir=terraform/acceptance init -backend=false -input=false -lockfile=readonly -no-color
          terraform -chdir=terraform/acceptance test -test-directory=tests -no-color

      - name: Rehearse single-operator dev lab without AWS credentials
        run: |
          cp terraform/.terraform.lock.hcl terraform/lab/.terraform.lock.hcl
          terraform -chdir=terraform/lab init -backend=false -input=false -lockfile=readonly -no-color
          terraform -chdir=terraform/lab validate -no-color
          terraform -chdir=terraform/lab test -no-color

  scanner-boundary:
    name: Locked Scanner Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Build and verify locked Snyk binary
        run: PYTHONPATH=cli python3 -m devsecops_cli.scanner prepare
      - name: Prove scanner isolation with sentinel credentials
        run: PYTHONPATH=cli python3 -m devsecops_cli.scanner probe
