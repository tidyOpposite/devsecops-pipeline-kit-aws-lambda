name: Secure Serverless DevSecOps Pipeline
run-name: DevSecOps ${{ github.event_name == 'workflow_dispatch' && format('{0} {1}{2}', inputs.mode, inputs.environment, inputs.request_id && format(' [{0}]', inputs.request_id) || '') || github.event_name }}

# All pull requests receive credential-free validation. AWS-backed operations
# require an explicitly configured manual trigger from reviewed main code.
on:
  pull_request:
    branches:
      - main
  #checkov:skip=CKV_GHA_7:Manual production deploy needs enumerated mode/environment inputs and protected environment approval.
  workflow_dispatch:
    inputs:
      mode:
        description: Sandbox plan for dev, or deploy/rollback prod; main only
        required: true
        default: plan
        type: choice
        options:
          - plan
          - deploy
          - rollback
      environment:
        description: Sandbox plan requires dev; deploy and rollback require prod
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      image_uri:
        description: Reviewed ECR @sha256 image URI for deploy or rollback
        required: false
        type: string
      commit_sha:
        description: Reviewed main commit from devsecops deploy --dry-run
        required: false
        type: string
      config_sha256:
        description: Reviewed configuration SHA-256 from devsecops deploy --dry-run
        required: false
        type: string
      request_id:
        description: Unique CLI request identifier
        required: false
        type: string
      rollback_from_image_uri:
        description: Expected active image for a rollback inferred from a deployment
        required: false
        type: string
      rollback_function_arn:
        description: Expected Lambda ARN for a rollback inferred from a deployment
        required: false
        type: string

permissions:
  # Individual jobs opt into AWS OIDC only when required.
  contents: read

# Serialize manual operations per workspace; keep PR validation queues separate.
# Never cancel an apply or rollback that may be changing remote infrastructure.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-validation-{0}', github.event.pull_request.number) || format('terraform-{0}', inputs.environment) }}
  cancel-in-progress: false
  queue: max

env:
  PIPELINE_CONFIG_JSON: ${{ vars.PIPELINE_CONFIG_JSON }}
  ENABLE_AWS_PLAN: ${{ vars.ENABLE_AWS_PLAN || 'false' }}
  PLAN_BACKEND_JSON: ${{ vars.PLAN_BACKEND_JSON }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'devsecops-pipeline' }}
  TF_VERSION: "1.10.5"
  TF_IN_AUTOMATION: "true"
  TF_WORKING_DIR: terraform
  DEPLOY_ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  DEPLOY_MODE: ${{ github.event.inputs.mode || '' }}
  DISPATCH_IMAGE_URI: ${{ github.event.inputs.image_uri || '' }}
  DISPATCH_COMMIT_SHA: ${{ github.event.inputs.commit_sha || '' }}
  DISPATCH_CONFIG_SHA256: ${{ github.event.inputs.config_sha256 || '' }}
  DISPATCH_REQUEST_ID: ${{ github.event.inputs.request_id || '' }}
  API_AUTHORIZATION_TYPE: ${{ vars.API_AUTHORIZATION_TYPE || 'AWS_IAM' }}
  ENABLE_SNYK_SCAN: ${{ vars.ENABLE_SNYK_SCAN || 'false' }}
  ENABLE_HTTP_VALIDATION: ${{ vars.ENABLE_HTTP_VALIDATION || 'false' }}
  ENABLE_DAST: ${{ vars.ENABLE_DAST || 'false' }}

jobs:
  security-and-validate:
    # This credential-free gate must succeed before any job can request AWS access.
    name: Security and Terraform Validate
    runs-on: ubuntu-latest
    outputs:
      plan_role_fingerprint: ${{ steps.plan-role-settings.outputs.role_fingerprint }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate workflow operation and environment
        if: github.event_name == 'workflow_dispatch'
        run: PYTHONPATH=cli python3 -m devsecops_cli.workflow --validate-request

      - name: Verify reviewed production intent before approval
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'deploy' || inputs.mode == 'rollback') && inputs.environment == 'prod' && github.ref == 'refs/heads/main'
        run: PYTHONPATH=cli python3 -m devsecops_cli.workflow --verify-intent

      - name: Validate repository plan role settings
        if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'deploy' || inputs.mode == 'rollback') && inputs.environment == 'prod' && github.ref == 'refs/heads/main'
        id: plan-role-settings
        env:
          EXPECTED_ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_TO_ASSUME_ARN }}
        run: PYTHONPATH=cli python3 -m devsecops_cli.oidc settings plan

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform -chdir="${TF_WORKING_DIR}" fmt -check -recursive

      - name: Terraform init without backend
        run: terraform -chdir="${TF_WORKING_DIR}" init -backend=false -input=false -no-color

      - name: Terraform validate
        run: terraform -chdir="${TF_WORKING_DIR}" validate -no-color

      - name: Run IaC scan with Trivy
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284 # v0.34.0
        with:
          scan-type: config
          scan-ref: ${{ env.TF_WORKING_DIR }}
          version: v0.71.0
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL

  terraform-plan:
    name: Sandbox Terraform Plan
    runs-on: ubuntu-latest
    needs: security-and-validate
    # Sandbox planning executes reviewed main code only, with explicit opt-in.
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'plan' && inputs.environment == 'dev' && github.ref == 'refs/heads/main' && vars.ENABLE_AWS_PLAN == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare user pipeline configuration
        run: PYTHONPATH=cli python3 -m devsecops_cli.workflow

      # Fail closed instead of silently granting a plan the more powerful deploy role.
      - name: Require separate AWS plan role
        env:
          EXPECTED_ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_TO_ASSUME_ARN }}
        run: PYTHONPATH=cli python3 -m devsecops_cli.oidc settings plan

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_TO_ASSUME_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir="${TF_WORKING_DIR}" init -input=false -no-color -backend-config=../dist/devsecops/backend.hcl

      - name: Select Terraform workspace
        run: |
          terraform -chdir="${TF_WORKING_DIR}" workspace select "${DEPLOY_ENVIRONMENT}" \
            || terraform -chdir="${TF_WORKING_DIR}" workspace new "${DEPLOY_ENVIRONMENT}"

      - name: Terraform plan
        run: |
          terraform -chdir="${TF_WORKING_DIR}" plan \
            -out=tfplan \
            -input=false \
            -no-color \
            -var="api_authorization_type=${API_AUTHORIZATION_TYPE}" \
            -var="project_name=${PROJECT_NAME}"
          terraform -chdir="${TF_WORKING_DIR}" show -no-color tfplan > "${TF_WORKING_DIR}/tfplan.txt"

      - name: Upload Terraform plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sandbox-terraform-plan-${{ env.DEPLOY_ENVIRONMENT }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan.txt
          retention-days: 14

  deploy-main:
    name: Manual Apply, Deploy, or Roll Back Production
    runs-on: ubuntu-latest
    needs: security-and-validate
    # Infrastructure mutation is restricted to manual production runs from main.
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'deploy' || github.event.inputs.mode == 'rollback') && github.event.inputs.environment == 'prod' && github.ref == 'refs/heads/main'
    # The protected GitHub environment performs its approval before this job can
    # obtain an OIDC token or read environment-scoped secrets.
    environment: prod
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      DEPLOY_ENVIRONMENT: prod
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify production policy and prepare pipeline configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=cli python3 -m devsecops_cli.workflow

      - name: Validate effective production role settings
        env:
          EXPECTED_ROLE_ARN: ${{ secrets.AWS_ROLE_TO_ASSUME_ARN }}
          PLAN_ROLE_FINGERPRINT: ${{ needs.security-and-validate.outputs.plan_role_fingerprint }}
        run: PYTHONPATH=cli python3 -m devsecops_cli.oidc settings deploy

      # Exchange GitHub's short-lived OIDC identity for the production role;
      # no long-lived AWS access keys are stored in repository secrets.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify reviewed Lambda image in ECR
        id: verify-image
        run: PYTHONPATH=cli python3 -m devsecops_cli.recovery verify-image

      - name: Capture currently deployed Lambda image
        id: capture-current-image
        env:
          RECOVERY_POINT_FILE: ${{ runner.temp }}/deployment-recovery.json
          ROLLBACK_FROM_IMAGE_URI: ${{ inputs.rollback_from_image_uri }}
          ROLLBACK_FUNCTION_ARN: ${{ inputs.rollback_function_arn }}
        run: PYTHONPATH=cli python3 -m devsecops_cli.recovery capture

      # Enabling the optional image scan makes its credentials and result blocking.
      - name: Require Snyk token when scan is enabled
        if: env.ENABLE_SNYK_SCAN == 'true' && env.SNYK_TOKEN == ''
        run: |
          echo "ENABLE_SNYK_SCAN is true, but SNYK_TOKEN is not configured." >&2
          exit 1

      - name: Set up Node.js for Snyk
        if: env.ENABLE_SNYK_SCAN == 'true' && env.SNYK_TOKEN != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Snyk CLI
        if: env.ENABLE_SNYK_SCAN == 'true' && env.SNYK_TOKEN != ''
        run: npm install -g snyk

      - name: Login to Amazon ECR for image scan
        if: env.ENABLE_SNYK_SCAN == 'true' && env.SNYK_TOKEN != ''
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        with:
          registries: ${{ steps.verify-image.outputs.registry_id }}

      - name: Scan configured Lambda image with Snyk
        if: env.ENABLE_SNYK_SCAN == 'true' && env.SNYK_TOKEN != ''
        run: snyk container test "${LAMBDA_IMAGE_URI}" --severity-threshold=high

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir="${TF_WORKING_DIR}" init -input=false -no-color -backend-config=../dist/devsecops/backend.hcl

      - name: Select Terraform workspace
        env:
          PREVIOUS_IMAGE_URI: ${{ steps.capture-current-image.outputs.previous_image_uri }}
        run: |
          if [ "${DEPLOY_MODE}" = 'deploy' ] && [ -z "${PREVIOUS_IMAGE_URI}" ]; then
            terraform -chdir="${TF_WORKING_DIR}" workspace select -or-create "${DEPLOY_ENVIRONMENT}"
          else
            terraform -chdir="${TF_WORKING_DIR}" workspace select "${DEPLOY_ENVIRONMENT}"
          fi

      - name: Verify Terraform recovery state
        id: recovery-state
        env:
          RECOVERY_FUNCTION_NAME: ${{ steps.capture-current-image.outputs.function_name }}
          RECOVERY_FUNCTION_ARN: ${{ steps.capture-current-image.outputs.function_arn }}
        run: PYTHONPATH=cli python3 -m devsecops_cli.recovery state

      - name: Upload deployment recovery point
        if: env.DEPLOY_MODE == 'deploy'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-recovery-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-recovery.json
          if-no-files-found: error

      - name: Plan production workload from reviewed inputs
        if: env.DEPLOY_MODE == 'deploy'
        run: |
          terraform -chdir="${TF_WORKING_DIR}" plan \
            -out=workload.tfplan \
            -input=false \
            -no-color \
            -var="api_authorization_type=${API_AUTHORIZATION_TYPE}" \
            -var="project_name=${PROJECT_NAME}" \
            -var="lambda_image_uri=${LAMBDA_IMAGE_URI}"

      - name: Terraform apply workload with configured Lambda image
        id: apply-workload
        if: env.DEPLOY_MODE == 'deploy'
        run: terraform -chdir="${TF_WORKING_DIR}" apply -input=false -no-color workload.tfplan

      - name: Restore requested Lambda image
        if: env.DEPLOY_MODE == 'rollback'
        env:
          RECOVERY_FUNCTION_NAME: ${{ steps.capture-current-image.outputs.function_name }}
          RECOVERY_FUNCTION_ARN: ${{ steps.capture-current-image.outputs.function_arn }}
          RECOVERY_REVISION_ID: ${{ steps.capture-current-image.outputs.revision_id }}
          RECOVERY_IMAGE_URI: ${{ env.LAMBDA_IMAGE_URI }}
          RECOVERY_HEALTH_URL: ${{ steps.recovery-state.outputs.health_url }}
          RECOVERY_AUTH_TYPE: ${{ steps.recovery-state.outputs.auth_type }}
        run: PYTHONPATH=cli python3 -m devsecops_cli.recovery restore

      - name: Read deployment outputs
        id: deployment-outputs
        run: |
          echo "api_gateway_invoke_url=$(terraform -chdir="${TF_WORKING_DIR}" output -raw api_gateway_invoke_url)" >> "${GITHUB_OUTPUT}"
          echo "api_gateway_health_url=$(terraform -chdir="${TF_WORKING_DIR}" output -raw api_gateway_health_url)" >> "${GITHUB_OUTPUT}"

      - name: Wait for Lambda update
        if: env.DEPLOY_MODE == 'deploy'
        run: aws lambda wait function-updated --function-name "${{ steps.capture-current-image.outputs.function_name }}"

      # IAM-protected endpoints are signed with the temporary session credentials;
      # explicitly public endpoints use a normal unauthenticated request.
      - name: Smoke test Lambda health endpoint
        if: env.DEPLOY_MODE == 'deploy'
        timeout-minutes: 1
        env:
          HEALTH_URL: ${{ steps.deployment-outputs.outputs.api_gateway_health_url }}
        run: |
          health_args=(--timeout 20 --format json)
          if [ "${API_AUTHORIZATION_TYPE}" = "AWS_IAM" ]; then
            health_args+=(--aws-sigv4 --aws-region "${AWS_REGION}")
          fi
          PYTHONPATH=cli python3 -m devsecops_cli health --url "${HEALTH_URL}" \
            "${health_args[@]}"

      # The baseline scanner is unauthenticated, so it is safe and useful only for
      # an API intentionally configured as public.
      - name: Run DAST scan with OWASP ZAP
        if: env.ENABLE_DAST == 'true' && ((env.DEPLOY_MODE == 'deploy' && env.API_AUTHORIZATION_TYPE == 'NONE') || (env.DEPLOY_MODE == 'rollback' && steps.recovery-state.outputs.auth_type == 'NONE'))
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: ${{ steps.deployment-outputs.outputs.api_gateway_invoke_url }}
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-baseline-prod
          cmd_options: "-a -m 5 -I"

      - name: Skip unauthenticated DAST for IAM-protected API
        if: env.ENABLE_DAST == 'true' && ((env.DEPLOY_MODE == 'deploy' && env.API_AUTHORIZATION_TYPE != 'NONE') || (env.DEPLOY_MODE == 'rollback' && steps.recovery-state.outputs.auth_type != 'NONE'))
        run: |
          echo "OWASP ZAP baseline is skipped unless the deployed API is explicitly public."

      # Restore the captured image only after an attempted workload apply.
      - name: Roll back Lambda image on failed deployment validation
        if: failure() && env.DEPLOY_MODE == 'deploy' && (steps.apply-workload.outcome == 'success' || steps.apply-workload.outcome == 'failure') && steps.capture-current-image.outputs.previous_image_uri != ''
        env:
          RECOVERY_FUNCTION_NAME: ${{ steps.capture-current-image.outputs.function_name }}
          RECOVERY_FUNCTION_ARN: ${{ steps.capture-current-image.outputs.function_arn }}
          RECOVERY_IMAGE_URI: ${{ steps.capture-current-image.outputs.previous_image_uri }}
          RECOVERY_HEALTH_URL: ${{ steps.recovery-state.outputs.health_url }}
          RECOVERY_AUTH_TYPE: ${{ steps.recovery-state.outputs.auth_type }}
        run: PYTHONPATH=cli python3 -m devsecops_cli.recovery restore
