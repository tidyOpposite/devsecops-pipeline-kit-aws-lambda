name: Publish GitHub Release

# Only semantic-looking version tags enter the publication path.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  # Keep the workflow read-only unless a job explicitly needs broader access.
  contents: read

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Repository writes are scoped to the single job that creates the release.
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # Pinned packaging tools make wheel and source archive creation repeatable.
      - name: Build Python package artifacts
        run: |
          python -m pip install --upgrade pip==26.1.2 build==1.5.0 setuptools==82.0.1 wheel==0.47.0
          python -m build

      # Ship the reviewed standalone installer alongside Python package formats.
      - name: Stage installer
        run: |
          cp install.sh dist/install.sh
          chmod 0755 dist/install.sh

      # Cover every downloadable artifact and immediately verify the manifest.
      - name: Generate release checksums
        run: |
          cd dist
          sha256sum install.sh *.whl *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS

      # Prefer notes dedicated to this tag, with the changelog as a safe fallback.
      - name: Resolve release notes
        id: notes
        run: |
          notes_path="docs/release-${GITHUB_REF_NAME}.md"
          if [ ! -f "${notes_path}" ]; then
            notes_path="CHANGELOG.md"
          fi
          echo "path=${notes_path}" >> "${GITHUB_OUTPUT}"

      # The commit-pinned publisher uploads only files produced by this job.
      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/install.sh
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          draft: false
          prerelease: false
